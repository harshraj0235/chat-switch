<!-- 
  This is a placeholder SVG icon for the AI Context Switcher extension.
  The actual icon PNG files need to be generated from this SVG.
  Use the generate-icons.html file to create proper PNG icons.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0f0f1a"/>
    </linearGradient>
    <linearGradient id="bolt" x1="40" y1="20" x2="88" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="ring" x1="20" y1="20" x2="108" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  
  <!-- Circular arrows -->
  <g fill="none" stroke="url(#ring)" stroke-width="5" stroke-linecap="round">
    <!-- Top arc -->
    <path d="M 84 30 A 34 34 0 0 1 98 64" />
    <!-- Arrow head top -->
    <polygon points="98,64 92,54 104,56" fill="url(#ring)" stroke="none"/>
    
    <!-- Bottom arc -->
    <path d="M 44 98 A 34 34 0 0 1 30 64" />
    <!-- Arrow head bottom -->
    <polygon points="30,64 36,74 24,72" fill="url(#ring)" stroke="none"/>
    
    <!-- Right arc -->
    <path d="M 98 64 A 34 34 0 0 1 64 98" />
    
    <!-- Left arc -->
    <path d="M 30 64 A 34 34 0 0 1 64 30" />
  </g>
  
  <!-- Lightning bolt -->
  <path d="M 70 28 L 52 66 L 64 66 L 58 100 L 76 58 L 64 58 Z" fill="url(#bolt)"/>
  
  <!-- Glow effect -->
  <circle cx="64" cy="64" r="30" fill="none" stroke="#7c3aed" stroke-width="1" opacity="0.3"/>
</svg>
