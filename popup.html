<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Context Switcher</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="header">
      <div class="header-brand">
        <div class="logo">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
            <path d="M13 3L4 14h7l-2 7 9-11h-7l2-7z" fill="url(#bolt)" stroke="none"/>
            <defs>
              <linearGradient id="bolt" x1="4" y1="3" x2="20" y2="21">
                <stop offset="0%" stop-color="#a78bfa"/>
                <stop offset="100%" stop-color="#7c3aed"/>
              </linearGradient>
            </defs>
          </svg>
        </div>
        <div>
          <h1 class="header-title">AI Context Switcher</h1>
          <p class="header-sub">Switch chats across AI platforms instantly</p>
        </div>
      </div>
    </header>

    <!-- Status Bar -->
    <div class="status-bar" id="statusBar">
      <div class="status-dot"></div>
      <span id="statusText">Ready to capture</span>
    </div>

    <!-- Context Preview -->
    <div class="context-card" id="contextCard" style="display:none;">
      <div class="context-header">
        <div class="context-info">
          <span class="context-badge" id="contextSource"></span>
          <span class="context-count" id="contextCount"></span>
        </div>
        <button class="btn-icon" id="clearContextBtn" title="Clear context">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 6L6 18M6 6l12 12"/>
          </svg>
        </button>
      </div>
      <div class="context-preview" id="contextPreview"></div>
    </div>

    <!-- Empty State -->
    <div class="empty-state" id="emptyState">
      <div class="empty-icon">📋</div>
      <p class="empty-title">No context captured yet</p>
      <p class="empty-desc">Go to any AI chat, click <strong>"Capture Context"</strong> button, then switch!</p>
    </div>

    <!-- Capture Button -->
    <button class="btn-capture" id="captureBtn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 5v14M5 12h14"/>
      </svg>
      Capture Current Chat
    </button>

    <!-- Switch To Section -->
    <div class="section">
      <h2 class="section-title">Switch Context To</h2>
      <div class="platform-grid" id="platformGrid">
        <!-- Platforms injected by JS -->
      </div>
    </div>

    <!-- Quick Actions -->
    <div class="section">
      <h2 class="section-title">Quick Actions</h2>
      <div class="actions-row">
        <button class="btn-action" id="copyContextBtn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="9" y="9" width="13" height="13" rx="2"/>
            <path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/>
          </svg>
          Copy as Text
        </button>
        <button class="btn-action" id="exportJsonBtn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          Export JSON
        </button>
      </div>
    </div>

    <!-- History -->
    <div class="section">
      <div class="section-header">
        <h2 class="section-title">Recent Switches</h2>
        <span class="history-count" id="historyCount"></span>
      </div>
      <div class="history-list" id="historyList">
        <!-- History items injected by JS -->
      </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <span>v1.0.0</span>
      <span>•</span>
      <span>Made with ⚡</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
